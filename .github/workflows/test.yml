name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: CGO_ENABLED=1 go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/treetest
      - run: go run ./cmd/treetest validate --study studies/prometheus
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/tests/*.test.mjs
